name: linkedin_analytics
version: "1.0.0"
config-version: 2
profile: linkedin_analytics

# Nada sai do seu computador: sem estatísticas de uso e sem checagem de versão online.
flags:
  send_anonymous_usage_stats: false
  version_check: false

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: [target, dbt_packages, logs]

vars:
  # Export do LinkedIn (.xlsx) a carregar. Vazio por padrão: sem arquivo, o build
  # só recalcula (seletor "transform"). Para carregar use scripts/ingest.sh <arquivo>.
  linkedin_export: null
  # true = recarrega um export que já está no histórico (ex.: depois de mudar o staging)
  force_reload: false
  # Fração dos dias com menos impressões da SUA conta que conta como "quase sem
  # impressões" (base de seguidores). Relativo, para valer em contas de qualquer tamanho.
  low_activity_quantile: 0.25
  # Janela (dias) para atribuir seguidores a um post: dia do post + N-1 seguintes.
  # null = automático: metade do intervalo típico entre posts, entre 1 e 3 dias.
  follower_attribution_days: null
  # O LinkedIn lista no máximo este número de posts em cada ranking da aba TOP POSTS.
  # Quando uma lista chega nele, as análises por post só veem os melhores posts.
  top_posts_list_limit: 50

# Devolve ao arquivo o espaço de linhas apagadas/substituídas.
on-run-end:
  - "checkpoint"

models:
  linkedin_analytics:
    staging:
      +materialized: view
      +tags: [ingest]
    landing:
      +tags: [ingest]
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  linkedin_analytics:
    +column_types:
      priority: integer
